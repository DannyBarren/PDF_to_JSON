[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-json"
version = "0.1.0"
description = "Translate real-world trades PDFs into valid GenerSwift ReportTemplate JSON (schema_version 3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GenerSwift" }]
keywords = ["pdf", "json", "report-template", "generswift", "jobdoc", "llm"]

dependencies = [
    "pydantic>=2.6,<3",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openai>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
pdf-to-json = "pdf_to_json.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
pdf_to_json = ["py.typed", "static/*"]
